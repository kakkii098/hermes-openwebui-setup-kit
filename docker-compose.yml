  #   command: >  
  #     bash -c "
  #       apt update && apt upgrade -y && apt install -y sox git && \
  #       python3 -m pip install -U torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cu124 --break-system-packages && \
